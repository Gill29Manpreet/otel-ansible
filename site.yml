- name: Install Docker
  hosts: docker_host
  become: true
  roles:
    - docker

- name: Prepare base directories (Agents)
  hosts: otel_agents
  become: true
  roles:
    - base
    - otel_agent

- name: Prepare base directories (Gateways)
  hosts: otel_gateways
  become: true
  roles:
    - base
    - otel-gateway

